[project]
name = "portifolio"
version = "1.0.0"
description = "Portfólio de Gabriel Accioly: Django + Tailwind CSS."
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "django-tailwind-cli>=4.9,<5",
    "gunicorn>=23",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pillow>=11",
    "playwright>=1.50",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"portfolio/tests/*" = ["S101"]
"portfolio/content/*" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
